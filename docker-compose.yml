services:
  db:
    image: mysql:8
    container_name: orbit-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: orbit
    ports:
      - "3306:3306"

  db-test:
    image: mysql:8
    container_name: orbit-db-test
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: orbit_test
    ports:
      - "3307:3306"      
    